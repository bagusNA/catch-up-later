app:
  security:
    session:
      # MockMvc does not exercise TLS, so secure cookies are disabled in tests.
      cookie-secure: false
    registration:
      # Public registration is disabled by default in production; the
      # registration tests opt in explicitly.
      enabled: true
  storage:
    # Artifacts are written under the build directory so test runs never touch
    # the development data directory.
    artifacts-dir: build/test-data/artifacts
    staging-dir: build/test-data/staging
